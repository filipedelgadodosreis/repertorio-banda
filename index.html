<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Banda">
<meta name="theme-color" content="#0f0f13">
<title>Banda</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0f0f13;--surface:#1a1a22;--surface2:#23232f;
  --accent:#f5c842;--text:#f0ede8;--muted:#7a7a8c;--border:#2e2e3e;
  --green:#25D366;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
}
body.light{
  --bg:#f5f5f0;--surface:#ffffff;--surface2:#f0ede8;
  --accent:#d4a017;--text:#1a1a22;--muted:#888;--border:#ddd;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;min-height:100vh;}
.page{display:none;padding:calc(var(--safe-top) + 24px) 16px 100px;}
.page.active{display:block;}

/* Header */
.app-header{text-align:center;margin-bottom:32px;}
.app-header h1{font-size:2rem;font-weight:800;color:var(--accent);}
.app-header p{color:var(--muted);font-size:.85rem;margin-top:4px;}

/* Home cards */
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.home-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px 16px;text-align:center;cursor:pointer;text-decoration:none;display:block;transition:transform .15s;}
.home-card:active{transform:scale(.97);}
.home-card .hc-icon{font-size:2.4rem;margin-bottom:10px;}
.home-card .hc-title{font-size:.95rem;font-weight:700;color:var(--text);margin-bottom:4px;}
.home-card .hc-sub{font-size:.72rem;color:var(--muted);}
.home-card.accent{background:var(--accent);border-color:var(--accent);grid-column:1/-1;}
.home-card.accent .hc-title,.home-card.accent .hc-sub{color:#1a1a22;}

/* Bottom nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;padding:8px 0 calc(var(--safe-bot) + 4px);z-index:100;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0;border:none;background:none;}
.nav-item .ni-icon{font-size:1.4rem;}
.nav-item .ni-label{font-size:.62rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.nav-item.active .ni-label{color:var(--accent);}
.nav-item.active .ni-icon{filter:drop-shadow(0 0 4px var(--accent));}
</style>
</head>
<body>

<!-- HOME -->
<div class="page active" id="page-home">
  <div class="app-header">
    <h1>&#127928; Banda</h1>
    <p>Organize o repertório da sua banda</p>
  </div>
  <div class="home-grid">
    <a class="home-card accent" href="repertorio.html">
      <div class="hc-icon">&#127925;</div>
      <div class="hc-title">Montar Repertório</div>
      <div class="hc-sub">Crie e envie pro WhatsApp</div>
    </a>
    <a class="home-card" href="cifras.html">
      <div class="hc-icon">&#128195;</div>
      <div class="hc-title">Cifras</div>
      <div class="hc-sub">Biblioteca do Drive</div>
    </a>
    <a class="home-card" href="config.html">
      <div class="hc-icon">&#9881;</div>
      <div class="hc-title">Config</div>
      <div class="hc-sub">Tema e preferências</div>
    </a>
  </div>
</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <button class="nav-item active" onclick="window.location.href='index.html'">
    <span class="ni-icon">&#127968;</span>
    <span class="ni-label">Início</span>
  </button>
  <button class="nav-item" onclick="window.location.href='repertorio.html'">
    <span class="ni-icon">&#127925;</span>
    <span class="ni-label">Repertório</span>
  </button>
  <button class="nav-item" onclick="window.location.href='cifras.html'">
    <span class="ni-icon">&#128195;</span>
    <span class="ni-label">Cifras</span>
  </button>
  <button class="nav-item" onclick="window.location.href='config.html'">
    <span class="ni-icon">&#9881;</span>
    <span class="ni-label">Config</span>
  </button>
</nav>

<script>
// Apply saved theme
try{if(localStorage.getItem('theme')==='light')document.body.classList.add('light');}catch(e){}
</script>
</body>
</html>
