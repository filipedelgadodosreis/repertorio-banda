<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--bg:#0f0f13;--surface:#1a1a22;--surface2:#23232f;--accent:#f5c842;--text:#f0ede8;--muted:#7a7a8c;--border:#2e2e3e;--green:#25D366;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);}
body.light{--bg:#f5f5f0;--surface:#ffffff;--surface2:#f0ede8;--accent:#d4a017;--text:#1a1a22;--muted:#888;--border:#ddd;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;min-height:100vh;padding:calc(var(--safe-top) + 32px) 16px calc(var(--safe-bot) + 100px);}
.app-header{text-align:center;margin-bottom:40px;}
.app-icon{width:100px;height:100px;margin:0 auto 16px;background:linear-gradient(135deg,#1a1a22,#23232f);border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:56px;box-shadow:0 4px 24px rgba(245,200,66,0.25);border:1px solid #3a3a2a;}
.app-header h1{font-size:2.2rem;font-weight:800;color:var(--accent);letter-spacing:-1px;}
.app-header .hebrew{font-size:1.1rem;color:var(--muted);margin-top:4px;letter-spacing:2px;}
.app-header p{color:var(--muted);font-size:.82rem;margin-top:6px;}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.home-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px 16px;text-align:center;cursor:pointer;text-decoration:none;display:block;transition:transform .15s;}
.home-card:active{transform:scale(.97);}
.hc-icon{font-size:2.4rem;margin-bottom:10px;}
.hc-title{font-size:.95rem;font-weight:700;color:var(--text);margin-bottom:4px;}
.hc-sub{font-size:.72rem;color:var(--muted);}
.home-card.accent{background:var(--accent);border-color:var(--accent);grid-column:1/-1;}
.home-card.accent .hc-title,.home-card.accent .hc-sub{color:#1a1a22;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;padding:8px 0 calc(var(--safe-bot) + 4px);z-index:100;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0;border:none;background:none;}
.nav-item .ni-icon{font-size:1.4rem;}
.nav-item .ni-label{font-size:.62rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.nav-item.active .ni-label{color:var(--accent);}
</style>
</head>
