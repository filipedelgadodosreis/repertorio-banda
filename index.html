<script>
(function(){
  var manifest = {
    name: "Repertório da Banda",

    display: "standalone",

      sizes: "512x512", type: "image/svg+xml"

  };
  var blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
  var url  = URL.createObjectURL(blob);
  var link = document.createElement('link');
  link.rel = 'manifest'; link.href = url;
  document.head.appendChild(link);
})();
</script>

<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #23232f;
    --accent: #f5c842;
    --text: #f0ede8;
    --muted: #7a7a8c;
    --border: #2e2e3e;
    --green: #25D366;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    min-height: 100vh;
    /* Push content below iOS status bar in standalone */
    padding: calc(var(--safe-top) + 24px) 16px calc(var(--safe-bot) + 48px);
  }

  header { text-align: center; margin-bottom: 28px; }
  header h1 { font-size: 1.8rem; font-weight: 800; color: var(--accent); }
  header p { color: var(--muted); font-size: 0.85rem; margin-top: 6px; }

  /* Install banner — shown only when NOT in standalone */
  #install-banner {
    display: flex; align-items: flex-start; gap: 12px;
    background: #1a1a10; border: 1px solid #3a3a10;
    border-radius: 14px; padding: 14px; margin-bottom: 16px;
  }
  #install-banner .icon { font-size: 2rem; flex-shrink: 0; }
  #install-banner h3 { font-size: 0.88rem; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  #install-banner p { font-size: 0.78rem; color: var(--muted); line-height: 1.5; }
  #install-banner strong { color: var(--text); }
  #install-banner .dismiss {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; font-family: inherit; font-size: 0.75rem;
    padding: 4px 10px; cursor: pointer; margin-top: 8px; display: inline-block;
  }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 14px; }
  .lbl { display: block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin-bottom: 8px; }

  input[type="text"], select {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-family: inherit; font-size: 0.95rem;
    padding: 10px 14px; outline: none; -webkit-appearance: none; appearance: none;
  }
  .day-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  #songs-list { display: flex; flex-direction: column; gap: 12px; }

  .song-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
  .song-card.has-cifra { border-color: #2a4a2e; }
  .song-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .song-num { font-size: 0.65rem; color: var(--muted); font-weight: 700; text-transform: uppercase; }
  .rm-btn { background: none; border: 1px solid #2e1e1e; color: #8a5a5a; border-radius: 8px; font-family: inherit; font-size: 0.75rem; padding: 4px 8px; cursor: pointer; }

  .song-row1 { display: grid; grid-template-columns: 1fr 72px; gap: 8px; margin-bottom: 8px; }

  .name-wrap { position: relative; }
  .name-inp { background: var(--bg); border: 1px solid #1e1e2a; border-radius: 10px; color: var(--text); font-family: inherit; font-size: 0.9rem; padding: 8px 12px; outline: none; width: 100%; -webkit-appearance: none; }
  .name-inp:focus { border-color: var(--accent); }

  .autocomplete-list { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: #1e1e2c; border: 1px solid #3a3a52; border-radius: 10px; z-index: 200; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.6); }
  .autocomplete-header { font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 7px 12px 5px; border-bottom: 1px solid #2e2e3e; }
  .autocomplete-item { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #23232f; }
  .autocomplete-item:last-child { border-bottom: none; }
  .autocomplete-item:active { background: #2a3a2a; }
  .autocomplete-name { font-size: 0.88rem; color: var(--text); font-weight: 600; margin-bottom: 2px; }
  .autocomplete-name em { color: var(--accent); font-style: normal; }
  .autocomplete-meta { font-size: 0.72rem; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .tag { display: inline-block; font-size: 0.65rem; font-weight: 700; border-radius: 5px; padding: 1px 6px; }
  .tag-cifra { background: #1a3a20; color: #5ecf7a; }
  .tag-tom   { background: #2a2a10; color: var(--accent); }

  .tone-sel { width: 72px; background: var(--bg); border: 1px solid #1e1e2a; border-radius: 10px; color: var(--accent); font-family: inherit; font-size: 0.9rem; font-weight: 700; padding: 8px 6px; text-align: center; -webkit-appearance: none; appearance: none; outline: none; }

  .link-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .link-row input { flex: 1; background: var(--bg); border: 1px solid #1e1e2a; border-radius: 10px; color: #7a9abf; font-family: inherit; font-size: 0.8rem; padding: 7px 10px; outline: none; -webkit-appearance: none; width: 100%; }
  .yt-badge { font-size: 0.7rem; font-weight: 700; background: #c0392b; color: #fff; border-radius: 6px; padding: 3px 7px; white-space: nowrap; flex-shrink: 0; }

  .cifra-row { display: flex; align-items: center; gap: 6px; }
  .cifra-badge { font-size: 0.7rem; font-weight: 700; border-radius: 6px; padding: 3px 7px; white-space: nowrap; flex-shrink: 0; }
  .cifra-badge.found { background: #1a3a20; color: #5ecf7a; }
  .cifra-badge.none  { background: #2a2a1a; color: #888; }
  .cifra-link-inp { flex: 1; background: var(--bg); border: 1px solid #1e1e2a; border-radius: 10px; color: #5ecf7a; font-family: inherit; font-size: 0.8rem; padding: 7px 10px; outline: none; -webkit-appearance: none; width: 100%; }
  .cifra-link-inp.empty { color: var(--muted); }

  .empty-state { text-align: center; padding: 24px 12px; color: var(--muted); font-size: 0.9rem; }
  .empty-state span { font-size: 2rem; display: block; margin-bottom: 8px; }

  .add-btn { width: 100%; background: transparent; border: 1px dashed var(--border); border-radius: 10px; color: var(--muted); font-family: inherit; font-size: 0.9rem; padding: 11px; cursor: pointer; margin-top: 10px; }

  .preview-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  #preview-box { background: #0d1a0f; border: 1px solid #2a3d2e; border-radius: 12px; padding: 16px; font-size: 0.88rem; line-height: 1.75; white-space: pre-wrap; word-break: break-all; color: #c8eacc; min-height: 60px; }
  .copy-btn { background: var(--green); border: none; border-radius: 10px; color: #fff; font-family: inherit; font-size: 0.82rem; font-weight: 700; padding: 9px 18px; cursor: pointer; }
  .copy-btn:active { opacity: 0.8; }
</style>
</head>

<div class="card">

</div>

    { display: 'Louve a Ti',                                                        name: 'Louve a Ti',                         tone: '',   url: 'https://drive.google.com/file/d/1W98EOrQB4WbT1spxvd_47qoMyZUgbm45/view?usp=drivesdk' },
    { display: 'Eu Me Alegro em Ti - Hillsong',                                     name: 'Eu Me Alegro em Ti',                 tone: '',   url: 'https://drive.google.com/file/d/19W0JgPJxN48GbIyT7CLZhYwLMgpWlGj2/view?usp=drivesdk' },
    { display: 'Rasgue os Céus (D)',                                                name: 'Rasgue os Céus',                     tone: 'D',  url: 'https://drive.google.com/file/d/1vG4IcZDBjwZ6qUqIcL4xtCPm56GKvpHN/view?usp=drivesdk' },
    { display: 'Vem me Buscar / O Que Tua Glória Fez Comigo / Preciso de Ti (F)',   name: 'Vem me Buscar',                      tone: 'F',  url: 'https://drive.google.com/file/d/1DUyjgDhbvR4HQPTxY52R23PI2Wlse3ox/view?usp=drivesdk' },
    { display: 'Jesus em Tua Presença (A)',                                         name: 'Jesus em Tua Presença',              tone: 'A',  url: 'https://drive.google.com/file/d/1SeYKqp04qDpnV-uWy-WoquAIuokgnXdP/view?usp=drivesdk' },
    { display: 'Espírito Enche a Minha Vida / Ao Único - Medley (A)',               name: 'Espírito Enche a Minha Vida',        tone: 'A',  url: 'https://drive.google.com/file/d/1WhdzwsHCldnFvfcIpPLRMLO-KUMBqad-/view?usp=drivesdk' }
  ];

  function normalize(s) {
    return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
  }
  function searchCifras(q) {
    if (!q || q.length < 2) return [];
    var norm = normalize(q);
    var words = norm.split(' ').filter(function(w){return w.length>=2;});
    if (!words.length) return [];
    var results = [];
    for (var i=0;i<DRIVE_CIFRAS.length;i++) {
      var c=DRIVE_CIFRAS[i], hay=normalize(c.display)+' '+normalize(c.name), score=0;
      for (var j=0;j<words.length;j++) if (hay.indexOf(words[j])!==-1) score++;
      if (score>0) results.push({cifra:c, score:score/words.length});
    }
    results.sort(function(a,b){return b.score-a.score;});
    return results.slice(0,6).map(function(r){return r.cifra;});
  }
  function highlight(text,query) {
    var words=normalize(query).split(' ').filter(function(w){return w.length>=2;});
    var r=text;
    for (var i=0;i<words.length;i++) r=r.replace(new RegExp('('+words[i].replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<em>$1</em>');
    return r;
  }

  var songs = [];

  function mk(tag,cls){var e=document.createElement(tag);if(cls)e.className=cls;return e;}
  function setToneSelect(sel,tone){for(var i=0;i<sel.options.length;i++)if(sel.options[i].value===tone){sel.selectedIndex=i;return;}}

  function makeToneSelect(idx) {
    var sel=mk('select','tone-sel');
    for (var t=0;t<TONES.length;t++){var o=document.createElement('option');o.value=TONES[t];o.textContent=TONES[t]||'\u2014';if(TONES[t]===songs[idx].tone)o.selected=true;sel.appendChild(o);}
    (function(i,s){s.onchange=function(){songs[i].tone=s.value;updatePreview();};})(idx,sel);
    return sel;
  }
  function closeAllAutocompletes(){var l=document.querySelectorAll('.autocomplete-list');for(var i=0;i<l.length;i++)if(l[i].parentNode)l[i].parentNode.removeChild(l[i]);}

  function showAutocomplete(idx,matches,nameWrap,nameIn,toneSel,cifraInp,cifraBadge,card) {
    closeAllAutocompletes();
    if (!matches.length) return;
    var list=mk('div','autocomplete-list');
    var hdr=mk('div','autocomplete-header');hdr.textContent=matches.length+' cifra(s) encontrada(s) no Drive';list.appendChild(hdr);
    for (var m=0;m<matches.length;m++) {
      (function(cifra){
        var item=mk('div','autocomplete-item');
        var nd=mk('div','autocomplete-name');nd.innerHTML=highlight(cifra.display,nameIn.value);
        var md=mk('div','autocomplete-meta');md.innerHTML='Nome: <strong style="color:var(--text)">'+cifra.name+'</strong>';
        if (cifra.tone){var tt=mk('span','tag tag-tom');tt.textContent='Tom: '+cifra.tone;md.appendChild(tt);}
        var ct=mk('span','tag tag-cifra');ct.textContent='\u266B Cifra';md.appendChild(ct);
        item.appendChild(nd);item.appendChild(md);
        item.onmousedown=function(e){
          e.preventDefault();
          songs[idx].name=cifra.name; nameIn.value=cifra.name;
          if (cifra.tone){songs[idx].tone=cifra.tone;setToneSelect(toneSel,cifra.tone);}
          songs[idx].cifraUrl=cifra.url; cifraInp.value=cifra.url;
          cifraInp.className='cifra-link-inp';
          cifraBadge.className='cifra-badge found';cifraBadge.textContent='\u266B Cifra';
          card.className='song-card has-cifra';
          closeAllAutocompletes();updatePreview();
        };
        list.appendChild(item);
      })(matches[m]);
    }
    nameWrap.appendChild(list);
  }

  var searchTimers={};

  function renderSongs() {
    var list=document.getElementById('songs-list');list.innerHTML='';
    if (!songs.length){var e=mk('div','empty-state');e.innerHTML='<span>&#127925;</span>Adicione músicas ao repertório';list.appendChild(e);updatePreview();return;}
    for (var i=0;i<songs.length;i++) {
      (function(idx){
        var s=songs[idx];
        var card=mk('div','song-card'+(s.cifraUrl?' has-cifra':''));
        var hdr=mk('div','song-header');
        var num=mk('span','song-num');num.textContent='M\u00fasica '+(idx+1);
        var rmBtn=mk('button','rm-btn');rmBtn.textContent='\u2715 Remover';
        rmBtn.onmousedown=function(e){e.preventDefault();};
        rmBtn.onclick=(function(i){return function(){songs.splice(i,1);renderSongs();};})(idx);
        hdr.appendChild(num);hdr.appendChild(rmBtn);card.appendChild(hdr);

        var row1=mk('div','song-row1');
        var nw=mk('div','name-wrap');
        var ni=document.createElement('input');ni.type='text';ni.className='name-inp';ni.placeholder='Nome da música';ni.value=s.name;
        nw.appendChild(ni);
        var ts=makeToneSelect(idx);
        row1.appendChild(nw);row1.appendChild(ts);card.appendChild(row1);

        var lr=mk('div','link-row');
        var yb=mk('span','yt-badge');yb.textContent='\u25b6 YT';
        var li=document.createElement('input');li.type='text';li.placeholder='Link do YouTube';li.value=s.link;
        lr.appendChild(yb);lr.appendChild(li);card.appendChild(lr);

        var cr=mk('div','cifra-row');
        var cb=mk('span','cifra-badge');
        var ci=document.createElement('input');ci.type='text';ci.placeholder='Link da cifra (Drive)';
        if (s.cifraUrl){cb.className='cifra-badge found';cb.textContent='\u266B Cifra';ci.className='cifra-link-inp';ci.value=s.cifraUrl;}
        else{cb.className='cifra-badge none';cb.textContent='Sem cifra';ci.className='cifra-link-inp empty';ci.value='';}
        cr.appendChild(cb);cr.appendChild(ci);card.appendChild(cr);

        ni.oninput=(function(i,ni2,nw2,ts2,ci2,cb2,c){return function(){songs[i].name=ni2.value;songs[i].cifraUrl='';ci2.value='';ci2.className='cifra-link-inp empty';cb2.className='cifra-badge none';cb2.textContent='Sem cifra';c.className='song-card';if(searchTimers[i])clearTimeout(searchTimers[i]);searchTimers[i]=setTimeout(function(){showAutocomplete(i,searchCifras(ni2.value),nw2,ni2,ts2,ci2,cb2,c);},250);updatePreview();};})(idx,ni,nw,ts,ci,cb,card);
        ni.onfocus=(function(i,ni2,nw2,ts2,ci2,cb2,c){return function(){if(ni2.value.length>=2)showAutocomplete(i,searchCifras(ni2.value),nw2,ni2,ts2,ci2,cb2,c);};})(idx,ni,nw,ts,ci,cb,card);
        ni.onblur=function(){setTimeout(closeAllAutocompletes,150);};
        li.oninput=(function(i,l){return function(){songs[i].link=l.value;updatePreview();};})(idx,li);
        ci.oninput=(function(i,ci2,cb2,c){return function(){songs[i].cifraUrl=ci2.value;if(ci2.value){ci2.className='cifra-link-inp';cb2.className='cifra-badge found';cb2.textContent='\u266B Cifra';c.className='song-card has-cifra';}else{ci2.className='cifra-link-inp empty';cb2.className='cifra-badge none';cb2.textContent='Sem cifra';c.className='song-card';} updatePreview();};})(idx,ci,cb,card);

        list.appendChild(card);
      })(i);
    }
    updatePreview();
  }

  function buildMessage(){
    var greeting=document.getElementById('greeting').value.trim();
    var weekday=document.getElementById('weekday').value;
    var period=document.getElementById('period').value;
    var msg=greeting+'\n'+'Segue o repertório de '+weekday+' '+period+':\n';
    for (var i=0;i<songs.length;i++){var s=songs[i];if(s.name||s.link){var t=s.tone?' \u2013 '+s.tone:'';msg+='\n\uD83C\uDFB5 '+s.name+t+'\n'+s.link;if(s.cifraUrl)msg+='\n\uD83D\uDCCB Cifra: '+s.cifraUrl;}}
    return msg;
  }
  function updatePreview(){document.getElementById('preview-box').textContent=buildMessage();}

  document.getElementById('add-btn').onclick=function(){songs.push({name:'',tone:'',link:'',cifraUrl:''});renderSongs();setTimeout(function(){var inp=document.querySelectorAll('.name-inp');if(inp.length)inp[inp.length-1].focus();},50);};

  document.getElementById('copy-btn').onclick=function(){
    var btn=document.getElementById('copy-btn'),msg=buildMessage();
    function ok(){btn.textContent='\u2705 Copiado!';setTimeout(function(){btn.textContent='Copiar';},2000);}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(msg).then(ok).catch(fb);}else{fb();}
    function fb(){var ta=document.createElement('textarea');ta.value=msg;ta.style.cssText='position:fixed;top:0;left:0;opacity:0.01;width:1px;height:1px';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');ok();}catch(e){btn.textContent='Copie manualmente';}document.body.removeChild(ta);}
  };

  ['greeting','weekday','period'].forEach(function(id){var el=document.getElementById(id);el.oninput=updatePreview;el.onchange=updatePreview;});
  document.addEventListener('click',function(e){if(!e.target.closest||!e.target.closest('.name-wrap'))closeAllAutocompletes();});

  renderSongs();
})();
</script>
</body>
</html>
