<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f13">
<title>Config</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--bg:#0f0f13;--surface:#1a1a22;--surface2:#23232f;--accent:#f5c842;--text:#f0ede8;--muted:#7a7a8c;--border:#2e2e3e;--green:#25D366;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);}
body.light{--bg:#f5f5f0;--surface:#ffffff;--surface2:#f0ede8;--accent:#d4a017;--text:#1a1a22;--muted:#888;--border:#ddd;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;min-height:100vh;padding:calc(var(--safe-top) + 24px) 16px calc(var(--safe-bot) + 100px);}
.app-header{text-align:center;margin-bottom:28px;}
.app-header h1{font-size:1.6rem;font-weight:800;color:var(--accent);}
.section-title{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:0 0 10px 4px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:20px;}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);}
.setting-row:last-child{border-bottom:none;}
.setting-label{font-size:.92rem;font-weight:600;}
.setting-sub{font-size:.75rem;color:var(--muted);margin-top:2px;}
/* Toggle */
.toggle{position:relative;width:48px;height:28px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-track{position:absolute;inset:0;background:#3a3a52;border-radius:28px;transition:.2s;}
.toggle input:checked + .toggle-track{background:var(--accent);}
.toggle-thumb{position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.3);}
.toggle input:checked ~ .toggle-thumb{left:23px;}
/* Input */
.setting-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:.9rem;padding:9px 12px;outline:none;-webkit-appearance:none;margin-top:8px;}
/* Bottom nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;padding:8px 0 calc(var(--safe-bot) + 4px);z-index:100;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0;border:none;background:none;}
.nav-item .ni-icon{font-size:1.4rem;}
.nav-item .ni-label{font-size:.62rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.nav-item.active .ni-label{color:var(--accent);}
</style>
</head>
<body>
<div class="app-header">
  <h1>&#9881; Configurações</h1>
</div>

<p class="section-title">Aparência</p>
<div class="card">
  <div class="setting-row">
    <div>
      <div class="setting-label">Modo Claro</div>
      <div class="setting-sub">Alterna entre tema escuro e claro</div>
    </div>
    <label class="toggle">
      <input type="checkbox" id="theme-toggle">
      <div class="toggle-track"></div>
      <div class="toggle-thumb"></div>
    </label>
  </div>
</div>

<p class="section-title">Mensagem padrão</p>
<div class="card">
  <div class="setting-row" style="flex-direction:column;align-items:flex-start;">
    <div class="setting-label">Saudação padrão</div>
    <div class="setting-sub">Pré-preenche o campo de saudação</div>
    <input type="text" class="setting-input" id="default-greeting" placeholder="Ex: Bom dia pessoal! 🙌">
  </div>
  <div class="setting-row" style="flex-direction:column;align-items:flex-start;">
    <div class="setting-label">Nome do grupo</div>
    <div class="setting-sub">Aparece no rodapé da mensagem</div>
    <input type="text" class="setting-input" id="band-name" placeholder="Ex: Banda Louvor">
  </div>
</div>

<p class="section-title">Sobre</p>
<div class="card">
  <div class="setting-row">
    <div>
      <div class="setting-label">Versão do App</div>
      <div class="setting-sub">Repertório da Banda</div>
    </div>
    <div style="font-size:.85rem;color:var(--muted);">v2.0</div>
  </div>
  <div class="setting-row">
    <div>
      <div class="setting-label">Pasta de Cifras</div>
      <div class="setting-sub">Google Drive sincronizado</div>
    </div>
    <div style="font-size:.8rem;color:var(--green);">&#9679; Ativo</div>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-item" onclick="window.location.href='index.html'"><span class="ni-icon">&#127968;</span><span class="ni-label">Início</span></button>
  <button class="nav-item" onclick="window.location.href='repertorio.html'"><span class="ni-icon">&#127925;</span><span class="ni-label">Repertório</span></button>
  <button class="nav-item" onclick="window.location.href='cifras.html'"><span class="ni-icon">&#128195;</span><span class="ni-label">Cifras</span></button>
  <button class="nav-item active" onclick="window.location.href='config.html'"><span class="ni-icon">&#9881;</span><span class="ni-label">Config</span></button>
</nav>

<script>
(function(){
  function applyTheme(light){document.body.classList.toggle('light',light);}
  var t=document.getElementById('theme-toggle');
  var saved=false;try{saved=localStorage.getItem('theme')==='light';}catch(e){}
  t.checked=saved;applyTheme(saved);
  t.onchange=function(){var l=t.checked;applyTheme(l);try{localStorage.setItem('theme',l?'light':'dark');}catch(e){}};

  var dg=document.getElementById('default-greeting');
  var bn=document.getElementById('band-name');
  try{dg.value=localStorage.getItem('default_greeting')||'';bn.value=localStorage.getItem('band_name')||'';}catch(e){}
  dg.oninput=function(){try{localStorage.setItem('default_greeting',dg.value);}catch(e){}};
  bn.oninput=function(){try{localStorage.setItem('band_name',bn.value);}catch(e){}};
})();
</script>
</body>
</html>
