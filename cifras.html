<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f13">
<title>Cifras</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--bg:#0f0f13;--surface:#1a1a22;--surface2:#23232f;--accent:#f5c842;--text:#f0ede8;--muted:#7a7a8c;--border:#2e2e3e;--green:#25D366;--blue:#4a9eff;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);}
body.light{--bg:#f5f5f0;--surface:#ffffff;--surface2:#f0ede8;--accent:#d4a017;--text:#1a1a22;--muted:#888;--border:#ddd;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;min-height:100vh;padding:calc(var(--safe-top) + 16px) 16px calc(var(--safe-bot) + 100px);}

.header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.header h1{font-size:1.4rem;font-weight:800;color:var(--accent);flex:1;}
.count-badge{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:.8rem;font-weight:700;color:var(--accent);white-space:nowrap;}

.sync-bar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:14px;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s;}
.sync-dot.ok{background:var(--green);}
.sync-dot.loading{background:var(--accent);animation:pulse 1s infinite;}
.sync-dot.err{background:#e05555;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sync-status{flex:1;font-size:.8rem;color:var(--muted);}
.sync-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.78rem;font-weight:600;padding:6px 12px;cursor:pointer;white-space:nowrap;flex-shrink:0;}

.tabs{display:flex;gap:8px;margin-bottom:14px;}
.tab{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--muted);font-family:inherit;font-size:.78rem;font-weight:600;padding:9px 4px;cursor:pointer;text-align:center;}
.tab.active{background:var(--accent);border-color:var(--accent);color:#1a1a22;}

.search-wrap{position:relative;margin-bottom:12px;}
.search-inp{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:inherit;font-size:.92rem;padding:10px 16px 10px 40px;outline:none;-webkit-appearance:none;}
.search-inp:focus{border-color:var(--accent);}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:1rem;color:var(--muted);pointer-events:none;}

.filter-row{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;}
.filter-btn{background:var(--surface);border:1px solid var(--border);border-radius:20px;color:var(--muted);font-family:inherit;font-size:.75rem;font-weight:600;padding:5px 13px;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#1a1a22;}

/* Group cards */
.group-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;}
.group-header{display:flex;align-items:center;padding:13px 14px;cursor:pointer;gap:10px;}
.group-header:active{background:var(--surface2);}
.group-icon{font-size:1.3rem;flex-shrink:0;}
.group-info{flex:1;min-width:0;}
.group-name{font-size:.92rem;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.group-meta{display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap;}
.tone-pill{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:1px 7px;font-size:.67rem;font-weight:700;color:var(--accent);}
.versions-badge{font-size:.67rem;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:1px 7px;}
.group-arrow{font-size:.9rem;color:var(--muted);flex-shrink:0;transition:transform .2s;}
.group-arrow.open{transform:rotate(90deg);}

.versions-list{display:none;border-top:1px solid var(--border);}
.versions-list.open{display:block;}
.version-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;text-decoration:none;}
.version-item:last-child{border-bottom:none;}
.version-item:active{background:var(--surface2);}
.version-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-left:6px;}
.version-name{font-size:.82rem;color:var(--text);flex:1;}
.version-arrow{font-size:.9rem;color:var(--muted);}

/* Single item (no versions) */
.item-card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:13px;display:flex;align-items:center;gap:11px;margin-bottom:10px;cursor:pointer;text-decoration:none;}
.item-card:active{border-color:var(--accent);}
.item-card.vs-card{border-left:3px solid var(--blue);}
.item-icon{font-size:1.4rem;flex-shrink:0;}
.item-info{flex:1;min-width:0;}
.item-name{font-size:.9rem;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-meta{font-size:.7rem;color:var(--muted);margin-top:3px;display:flex;gap:6px;align-items:center;}
.vs-pill{background:#1a2a4a;border:1px solid #2a3a6a;border-radius:6px;padding:1px 7px;font-size:.67rem;font-weight:700;color:var(--blue);}
.item-arrow{color:var(--muted);font-size:1rem;flex-shrink:0;}

/* Sem tom editor */
.tom-editor{background:var(--surface2);border-top:1px solid var(--border);padding:10px 14px;display:none;align-items:center;gap:8px;}
.tom-editor.open{display:flex;}
.tom-editor select{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--accent);font-family:inherit;font-size:.85rem;font-weight:700;padding:5px 8px;outline:none;-webkit-appearance:none;}
.tom-editor .save-tom{background:var(--accent);border:none;border-radius:8px;color:#1a1a22;font-family:inherit;font-size:.78rem;font-weight:700;padding:5px 12px;cursor:pointer;}
.tom-editor label{font-size:.75rem;color:var(--muted);}

.empty{text-align:center;padding:40px 16px;color:var(--muted);}
.empty span{font-size:2.5rem;display:block;margin-bottom:8px;}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;padding:8px 0 calc(var(--safe-bot) + 4px);z-index:100;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0;border:none;background:none;}
.nav-item .ni-icon{font-size:1.4rem;}
.nav-item .ni-label{font-size:.62rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.nav-item.active .ni-label{color:var(--accent);}
</style>
</head>
<body>

<div class="header">
  <h1>&#128195; Cifras & VS</h1>
  <div class="count-badge" id="count-badge">&#8729; &#8729;</div>
</div>

<div class="sync-bar">
  <div class="sync-dot" id="sync-dot"></div>
  <div class="sync-status" id="sync-status">Aguardando...</div>
  <button class="sync-btn" id="sync-btn">&#8635; Sincronizar</button>
</div>

<div class="tabs">
  <button class="tab active" id="tab-cifras" onclick="switchTab('cifras')">&#128196; Cifras</button>
  <button class="tab" id="tab-vs" onclick="switchTab('vs')">&#127925; VS</button>
  <button class="tab" id="tab-semtom" onclick="switchTab('semtom')">&#9998; Sem Tom</button>
</div>

<div class="search-wrap" id="search-wrap">
  <span class="search-icon">&#128269;</span>
  <input class="search-inp" type="text" id="search-inp" placeholder="Buscar...">
</div>

<div class="filter-row" id="filter-row">
  <button class="filter-btn active" data-filter="all">Todas</button>
  <button class="filter-btn" data-filter="A">A</button>
  <button class="filter-btn" data-filter="B">B</button>
  <button class="filter-btn" data-filter="Bb">Bb</button>
  <button class="filter-btn" data-filter="C">C</button>
  <button class="filter-btn" data-filter="D">D</button>
  <button class="filter-btn" data-filter="E">E</button>
  <button class="filter-btn" data-filter="Eb">Eb</button>
  <button class="filter-btn" data-filter="F">F</button>
  <button class="filter-btn" data-filter="F#">F#</button>
  <button class="filter-btn" data-filter="G">G</button>
</div>

<div id="item-list">
  <div class="empty"><span>&#128195;</span>Toque em Sincronizar para carregar</div>
</div>

<nav class="bottom-nav">
  <button class="nav-item" onclick="window.location.href='index.html'"><span class="ni-icon">&#127968;</span><span class="ni-label">Início</span></button>
  <button class="nav-item" onclick="window.location.href='repertorio.html'"><span class="ni-icon">&#127925;</span><span class="ni-label">Repertório</span></button>
  <button class="nav-item active"><span class="ni-icon">&#128195;</span><span class="ni-label">Cifras</span></button>
  <button class="nav-item" onclick="window.location.href='config.html'"><span class="ni-icon">&#9881;</span><span class="ni-label">Config</span></button>
</nav>

<script>
(function(){
try{if(localStorage.getItem('theme')==='light')document.body.classList.add('light');}catch(e){}

var FOLDER_CIFRAS='1ZMtPTV1j-4rGVdoNcl1aqfJBr8gPOPid';
var FOLDER_VS='12MtjNimoJrmmlaOrqzsvQynIYsK9Ehe0';
var TONES=['','C','C#','Db','D','D#','Eb','E','F','F#','Gb','G','G#','Ab','A','A#','Bb','B','Cm','Dm','Em','Fm','Gm','Am','Bm'];

var allCifras=[],allVS=[],customToms={};
var currentTab='cifras',currentFilter='all',currentSearch='';

try{customToms=JSON.parse(localStorage.getItem('custom_toms')||'{}');}catch(e){}
function saveCustomToms(){try{localStorage.setItem('custom_toms',JSON.stringify(customToms));}catch(e){}}

function extractTone(t){
  var m;
  m=t.match(/\(([A-G][#b]?m?)\)(?:\s*[-–]|\s*\d|\s*$)/);if(m)return m[1];
  m=t.match(/\(([A-G][#b]?m?)\)/);if(m)return m[1];
  m=t.match(/[\.\s]([A-G][#b]?m?)[\.\s\d]/);if(m&&/^[A-G]/.test(m[1]))return m[1];
  return '';
}

function cleanName(t){
  return t
    .replace(/\.(pdf|docx|txt|html|mp3|wav|m4a|aac|ogg)$/i,'')
    .replace(/\s*[-–]\s*\d+\s*col(una)?s?\.?/gi,'')
    .replace(/\s*\(\d+\s*col(una)?s?\)/gi,'')
    .replace(/\s*\d+\s*col(una)?s?$/gi,'')
    .replace(/[\.\s]([A-G][#b]?m?)[\.\s]\d[^\)]/g,'')
    .replace(/\s+/g,' ').trim();
}

// Group files by base name (remove version suffixes)
function baseName(name){
  return name
    .replace(/\s*[-–]\s*(versão|version|ver\.?)\s*\w+/gi,'')
    .replace(/\s*\(\d+\s*col(una)?s?\)/gi,'')
    .replace(/\s*\d+\s*col(una)?s?$/gi,'')
    .replace(/\s*[-–]\s*\d+\s*col/gi,'')
    .replace(/\s*\(pgi?\)\s*\(\d+\)/gi,'')
    .replace(/\s*v\d+$/i,'')
    .replace(/\s*\(\d+\)$/,'')
    .replace(/\s+/g,' ').trim();
}

function dot(cls){document.getElementById('sync-dot').className='sync-dot'+(cls?' '+cls:'');}
function setStatus(msg){document.getElementById('sync-status').textContent=msg;}
function updateBadge(){
  var badge=document.getElementById('count-badge');
  // Count unique songs
  var names=new Set(allCifras.map(function(c){return baseName(c.name);}));
  badge.innerHTML='&#128196; <strong>'+names.size+'</strong> m\u00fasicas &nbsp;&#127925; <strong>'+allVS.length+'</strong> VS';
}

function fetchFolder(folderId,callback){
  var proxies=['https://corsproxy.io/?url=','https://api.allorigins.win/raw?url='];
  var apiUrl='https://www.googleapis.com/drive/v3/files'
    +'?q='+encodeURIComponent("'"+folderId+"' in parents and trashed=false")
    +'&fields=files(id,name,mimeType)'
    +'&pageSize=200';
  function tryProxy(idx){
    if(idx>=proxies.length){callback('Falha');return;}
    var xhr=new XMLHttpRequest();
    xhr.open('GET',proxies[idx]+encodeURIComponent(apiUrl));
    xhr.timeout=10000;
    xhr.onload=function(){
      try{var d=JSON.parse(xhr.responseText);if(d.files){callback(null,d.files);}else{tryProxy(idx+1);}}catch(e){tryProxy(idx+1);}
    };
    xhr.onerror=xhr.ontimeout=function(){tryProxy(idx+1);};
    xhr.send();
  }
  tryProxy(0);
}

function processFiles(files,type){
  return files
    .filter(function(f){return f.mimeType!=='application/vnd.google-apps.folder'&&!/\.html?$/i.test(f.name);})
    .map(function(f){
      var name=cleanName(f.name);
      var tone=customToms[f.id]||extractTone(f.name);
      return{id:f.id,name:name,base:baseName(name),tone:tone,mime:f.mimeType,type:type,url:'https://drive.google.com/file/d/'+f.id+'/view'};
    })
    .sort(function(a,b){return a.name.localeCompare(b.name,'pt');});
}

function sync(){
  var btn=document.getElementById('sync-btn');
  btn.textContent='...';btn.disabled=true;
  dot('loading');setStatus('Buscando no Drive...');
  var done=0,cifrasFiles=[],vsFiles=[],errs=[];
  function check(){
    done++;if(done<2)return;
    btn.textContent='\u21BA Sincronizar';btn.disabled=false;
    if(errs.length===2){dot('err');setStatus('Sem conex\u00e3o com o Drive');return;}
    allCifras=processFiles(cifrasFiles,'cifra');
    allVS=processFiles(vsFiles,'vs');
    try{localStorage.setItem('cache_cifras',JSON.stringify(allCifras));localStorage.setItem('cache_vs',JSON.stringify(allVS));localStorage.setItem('cache_time',Date.now().toString());}catch(e){}
    updateBadge();dot('ok');
    var t=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    setStatus('\u2713 Atualizado \u00e0s '+t+' \u00b7 '+allCifras.length+' cifras, '+allVS.length+' VS');
    render();
  }
  fetchFolder(FOLDER_CIFRAS,function(err,files){if(err)errs.push(err);else cifrasFiles=files;check();});
  fetchFolder(FOLDER_VS,function(err,files){if(err)errs.push(err);else vsFiles=files;check();});
}

function loadCache(){
  try{
    var c=JSON.parse(localStorage.getItem('cache_cifras')||'null');
    var v=JSON.parse(localStorage.getItem('cache_vs')||'null');
    var t=parseInt(localStorage.getItem('cache_time')||'0');
    if(c&&v){
      allCifras=c;allVS=v;
      allCifras.forEach(function(x){if(customToms[x.id])x.tone=customToms[x.id];});
      allVS.forEach(function(x){if(customToms[x.id])x.tone=customToms[x.id];});
      updateBadge();dot('ok');
      var mins=Math.floor((Date.now()-t)/60000);
      setStatus('\u2713 Cache de '+mins+'min \u00b7 '+allCifras.length+' cifras, '+allVS.length+' VS');
      render();return true;
    }
  }catch(e){}
  return false;
}

function switchTab(tab){
  currentTab=tab;currentFilter='all';currentSearch='';
  document.getElementById('search-inp').value='';
  document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
  var allBtn=document.querySelector('[data-filter="all"]');if(allBtn)allBtn.classList.add('active');
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  document.getElementById('tab-'+tab).classList.add('active');
  document.getElementById('filter-row').style.display=(tab==='vs'||tab==='semtom')?'none':'flex';
  render();
}

function matchFilter(item){
  if(currentFilter==='all')return true;
  if(!item.tone)return false;
  return item.tone===currentFilter||item.tone.replace('m','').charAt(0)===currentFilter;
}
function matchSearch(item){
  return !currentSearch||item.name.toLowerCase().indexOf(currentSearch.toLowerCase())!==-1||item.base.toLowerCase().indexOf(currentSearch.toLowerCase())!==-1;
}

function render(){
  var container=document.getElementById('item-list');
  container.innerHTML='';

  if(currentTab==='vs'){
    // VS: simple list, no grouping
    var vs=allVS.filter(matchSearch);
    if(!vs.length){container.innerHTML='<div class="empty"><span>&#127925;</span>Nenhum VS encontrado</div>';return;}
    vs.forEach(function(item){
      var card=document.createElement('a');
      card.className='item-card vs-card';
      card.href=item.url;card.target='_blank';card.rel='noopener';
      card.innerHTML='<span class="item-icon">&#127925;</span><div class="item-info"><div class="item-name">'+escHtml(item.name)+'</div><div class="item-meta"><span class="vs-pill">VS</span></div></div><span class="item-arrow">&#8250;</span>';
      container.appendChild(card);
    });
    document.getElementById('count-badge').innerHTML='<strong>'+vs.length+'</strong> VS';
    return;
  }

  if(currentTab==='semtom'){
    var semtom=allCifras.filter(function(c){return !c.tone&&matchSearch(c);});
    document.getElementById('count-badge').innerHTML='<strong>'+semtom.length+'</strong> sem tom';
    if(!semtom.length){container.innerHTML='<div class="empty"><span>&#9989;</span>Todas as cifras t\u00eam tom!</div>';return;}
    semtom.forEach(function(item){
      var card=document.createElement('div');
      card.className='item-card';
      var ed=document.createElement('div');ed.className='tom-editor';
      var lbl=document.createElement('label');lbl.textContent='Tom:';
      var sel=document.createElement('select');
      TONES.forEach(function(t){var o=document.createElement('option');o.value=t;o.textContent=t||'\u2014';if(t===item.tone)o.selected=true;sel.appendChild(o);});
      var sb=document.createElement('button');sb.className='save-tom';sb.textContent='Salvar';
      sb.onclick=function(e){e.stopPropagation();item.tone=sel.value;customToms[item.id]=sel.value;saveCustomToms();for(var i=0;i<allCifras.length;i++)if(allCifras[i].id===item.id){allCifras[i].tone=sel.value;break;}ed.classList.remove('open');setTimeout(render,200);};
      ed.appendChild(lbl);ed.appendChild(sel);ed.appendChild(sb);
      card.innerHTML='<span class="item-icon">&#128196;</span><div class="item-info"><div class="item-name">'+escHtml(item.name)+'</div><div class="item-meta">Sem tom</div></div><span class="item-arrow">&#9998;</span>';
      card.appendChild(ed);
      card.onclick=function(e){if(e.target.tagName==='OPTION'||e.target.tagName==='SELECT'||e.target.className==='save-tom')return;ed.classList.toggle('open');};
      container.appendChild(card);
    });
    return;
  }

  // CIFRAS tab: group by base name
  var filtered=allCifras.filter(function(c){return matchSearch(c)&&matchFilter(c);});

  // Group
  var groups={};var groupOrder=[];
  filtered.forEach(function(c){
    var b=c.base;
    if(!groups[b]){groups[b]=[];groupOrder.push(b);}
    groups[b].push(c);
  });

  // Update badge
  var badge=document.getElementById('count-badge');
  if(currentSearch||currentFilter!=='all'){
    badge.innerHTML='<strong>'+groupOrder.length+'</strong> m\u00fasicas';
  }else{updateBadge();}

  if(!groupOrder.length){container.innerHTML='<div class="empty"><span>&#128195;</span>Nenhuma cifra encontrada</div>';return;}

  groupOrder.forEach(function(base){
    var items=groups[base];
    var tone=items[0].tone;
    // Check if all share same tone
    var sameTone=items.every(function(i){return i.tone===tone;});
    if(!sameTone)tone='';

    if(items.length===1){
      // Single version — simple card
      var item=items[0];
      var card=document.createElement('a');
      card.className='item-card';
      card.href=item.url;card.target='_blank';card.rel='noopener';
      var metaHtml=item.tone?'<span class="tone-pill">'+escHtml(item.tone)+'</span>':'Sem tom';
      card.innerHTML='<span class="item-icon">&#128196;</span><div class="item-info"><div class="item-name">'+escHtml(item.name)+'</div><div class="item-meta">'+metaHtml+'</div></div><span class="item-arrow">&#8250;</span>';
      container.appendChild(card);
    }else{
      // Multiple versions — grouped card
      var group=document.createElement('div');
      group.className='group-card';
      var hdr=document.createElement('div');
      hdr.className='group-header';
      var vBadge=items.length+' vers\u00f5es';
      var toneHtml=tone?'<span class="tone-pill">'+escHtml(tone)+'</span>':'';
      hdr.innerHTML='<span class="group-icon">&#128196;</span><div class="group-info"><div class="group-name">'+escHtml(base)+'</div><div class="group-meta">'+toneHtml+'<span class="versions-badge">'+vBadge+'</span></div></div><span class="group-arrow">&#8250;</span>';
      var vList=document.createElement('div');
      vList.className='versions-list';
      items.forEach(function(v){
        var vItem=document.createElement('a');
        vItem.className='version-item';
        vItem.href=v.url;vItem.target='_blank';vItem.rel='noopener';
        var vName=v.name.replace(base,'').replace(/^\s*[-–]\s*/,'').trim()||v.name;
        if(!vName||vName===base)vName=v.name;
        var vtHtml=v.tone&&v.tone!==tone?'<span class="tone-pill" style="margin-left:auto">'+escHtml(v.tone)+'</span>':'';
        vItem.innerHTML='<span class="version-dot"></span><span class="version-name">'+escHtml(vName)+'</span>'+vtHtml+'<span class="version-arrow">&#8250;</span>';
        vList.appendChild(vItem);
      });
      hdr.onclick=function(){
        var arr=hdr.querySelector('.group-arrow');
        arr.classList.toggle('open');
        vList.classList.toggle('open');
      };
      group.appendChild(hdr);group.appendChild(vList);
      container.appendChild(group);
    }
  });
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

document.getElementById('search-inp').oninput=function(){currentSearch=this.value;render();};
document.getElementById('filter-row').onclick=function(e){
  var btn=e.target.closest('.filter-btn');if(!btn)return;
  document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');currentFilter=btn.dataset.filter;render();
};
document.getElementById('sync-btn').onclick=function(){sync();};

if(!loadCache()){sync();}else{setTimeout(sync,4000);}
})();
</script>
</body>
