<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f13">
<title>Cifras</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--bg:#0f0f13;--surface:#1a1a22;--surface2:#23232f;--accent:#f5c842;--text:#f0ede8;--muted:#7a7a8c;--border:#2e2e3e;--green:#25D366;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);}
body.light{--bg:#f5f5f0;--surface:#ffffff;--surface2:#f0ede8;--accent:#d4a017;--text:#1a1a22;--muted:#888;--border:#ddd;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;min-height:100vh;padding:calc(var(--safe-top) + 16px) 16px calc(var(--safe-bot) + 100px);}

.header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.header h1{font-size:1.4rem;font-weight:800;color:var(--accent);flex:1;}
.count-badge{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:.8rem;font-weight:700;color:var(--accent);white-space:nowrap;}
.count-badge span{color:var(--muted);font-weight:400;}

.sync-bar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:14px;}
.sync-status{flex:1;font-size:.8rem;color:var(--muted);}
.sync-status.ok{color:var(--green);}
.sync-status.err{color:#e05555;}
.sync-status.loading{color:var(--accent);}
.sync-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.78rem;font-weight:600;padding:6px 12px;cursor:pointer;white-space:nowrap;}
.sync-btn:active{opacity:.7;}
.spin{display:inline-block;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.search-wrap{position:relative;margin-bottom:12px;}
.search-inp{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:inherit;font-size:.92rem;padding:10px 16px 10px 40px;outline:none;-webkit-appearance:none;}
.search-inp:focus{border-color:var(--accent);}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:1rem;color:var(--muted);pointer-events:none;}

.filter-row{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;}
.filter-btn{background:var(--surface);border:1px solid var(--border);border-radius:20px;color:var(--muted);font-family:inherit;font-size:.75rem;font-weight:600;padding:5px 13px;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#1a1a22;}

.cifra-list{display:flex;flex-direction:column;gap:9px;}
.cifra-card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:13px;display:flex;align-items:center;gap:11px;text-decoration:none;transition:border-color .15s;}
.cifra-card:active{border-color:var(--accent);}
.cifra-icon{font-size:1.5rem;flex-shrink:0;}
.cifra-info{flex:1;min-width:0;}
.cifra-name{font-size:.9rem;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cifra-meta{font-size:.7rem;color:var(--muted);margin-top:3px;display:flex;gap:6px;align-items:center;}
.tone-pill{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:1px 7px;font-size:.67rem;font-weight:700;color:var(--accent);}
.cifra-arrow{color:var(--muted);font-size:1.1rem;flex-shrink:0;}

.empty{text-align:center;padding:40px 16px;color:var(--muted);}
.empty span{font-size:2.5rem;display:block;margin-bottom:8px;}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;padding:8px 0 calc(var(--safe-bot) + 4px);z-index:100;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0;border:none;background:none;}
.nav-item .ni-icon{font-size:1.4rem;}
.nav-item .ni-label{font-size:.62rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.nav-item.active .ni-label{color:var(--accent);}
</style>
</head>
<body>

<div class="header">
  <h1>&#128195; Cifras</h1>
  <div class="count-badge" id="count-badge">&#8729; <span>carregando</span></div>
</div>

<div class="sync-bar">
  <div class="sync-status" id="sync-status">Aguardando sincronização...</div>
  <button class="sync-btn" id="sync-btn">&#8635; Sincronizar</button>
</div>

<div class="search-wrap">
  <span class="search-icon">&#128269;</span>
  <input class="search-inp" type="text" id="search-inp" placeholder="Buscar cifra...">
</div>

<div class="filter-row" id="filter-row">
  <button class="filter-btn active" data-filter="all">Todas</button>
  <button class="filter-btn" data-filter="A">Tom A</button>
  <button class="filter-btn" data-filter="B">Tom B</button>
  <button class="filter-btn" data-filter="C">Tom C</button>
  <button class="filter-btn" data-filter="D">Tom D</button>
  <button class="filter-btn" data-filter="E">Tom E</button>
  <button class="filter-btn" data-filter="F">Tom F</button>
  <button class="filter-btn" data-filter="G">Tom G</button>
  <button class="filter-btn" data-filter="sem-tom">Sem tom</button>
</div>

<div class="cifra-list" id="cifra-list">
  <div class="empty"><span>&#128195;</span>Toque em Sincronizar para carregar as cifras</div>
</div>

<nav class="bottom-nav">
  <button class="nav-item" onclick="window.location.href='index.html'"><span class="ni-icon">&#127968;</span><span class="ni-label">Início</span></button>
  <button class="nav-item" onclick="window.location.href='repertorio.html'"><span class="ni-icon">&#127925;</span><span class="ni-label">Repertório</span></button>
  <button class="nav-item active"><span class="ni-icon">&#128195;</span><span class="ni-label">Cifras</span></button>
  <button class="nav-item" onclick="window.location.href='config.html'"><span class="ni-icon">&#9881;</span><span class="ni-label">Config</span></button>
</nav>

<script>
(function(){
try{if(localStorage.getItem('theme')==='light')document.body.classList.add('light');}catch(e){}

var FOLDER_ID = '1ZMtPTV1j-4rGVdoNcl1aqfJBr8gPOPid';
var API_KEY   = 'AIzaSyD-PLACEHOLDER'; // substitua pela sua API Key
var CACHE_KEY = 'cifras_cache';
var CACHE_TIME_KEY = 'cifras_cache_time';
var CACHE_TTL = 60 * 60 * 1000; // 1 hora

var allCifras = [];
var currentFilter = 'all';
var currentSearch = '';

function extractTone(title){
  var patterns = [/\(([A-G]#?b?m?)\)/g, /[\.\s\-]([A-G]#?b?m?)[\.\s\-]/g, /\.([A-G]#?b?m?)\./g];
  for(var p=0;p<patterns.length;p++){
    var m=patterns[p].exec(title);
    if(m && /^[A-G]/.test(m[1])) return m[1];
  }
  return '';
}

function cleanName(title){
  return title
    .replace(/\.(pdf|docx|txt|html)$/i,'')
    .replace(/\s*[-–]\s*\d+\s*col(una)?s?\.?/gi,'')
    .replace(/\s*\(\d+\s*col(una)?s?\)/gi,'')
    .replace(/\s*\d+\s*col(una)?s?$/gi,'')
    .replace(/\s*\([A-G]#?b?m?\)/g,'')
    .replace(/\s*\bv\d+\b$/i,'')
    .replace(/\.([A-G]#?b?m?)\.\d+/g,'')
    .replace(/\s+/g,' ').trim();
}

function fileIcon(mime){
  if(mime==='application/pdf') return '&#128196;';
  if(mime && mime.includes('word')) return '&#128196;';
  return '&#127925;';
}

// Fetch from Google Drive API
function fetchFromDrive(callback){
  var url = 'https://www.googleapis.com/drive/v3/files'
    + '?q=' + encodeURIComponent("'" + FOLDER_ID + "' in parents and trashed=false")
    + '&fields=files(id,name,mimeType,webViewLink)'
    + '&pageSize=200'
    + '&key=' + API_KEY;

  var xhr = new XMLHttpRequest();
  xhr.open('GET', url);
  xhr.onload = function(){
    if(xhr.status === 200){
      try{
        var data = JSON.parse(xhr.responseText);
        var files = (data.files||[]).filter(function(f){
          return f.mimeType !== 'application/vnd.google-apps.folder'
            && !/\.html?$/i.test(f.name);
        });
        var cifras = files.map(function(f){
          return {
            name: cleanName(f.name),
            tone: extractTone(f.name),
            url: 'https://drive.google.com/file/d/'+f.id+'/view',
            mime: f.mimeType
          };
        });
        cifras.sort(function(a,b){return a.name.localeCompare(b.name,'pt');});
        callback(null, cifras);
      }catch(e){ callback('Erro ao processar resposta'); }
    } else if(xhr.status === 400 || xhr.status === 403){
      callback('api_key_invalid');
    } else {
      callback('Erro '+xhr.status);
    }
  };
  xhr.onerror = function(){ callback('Sem conexão'); };
  xhr.send();
}

function setStatus(msg, cls){
  var el = document.getElementById('sync-status');
  el.textContent = msg;
  el.className = 'sync-status' + (cls ? ' '+cls : '');
}

function saveCache(cifras){
  try{
    localStorage.setItem(CACHE_KEY, JSON.stringify(cifras));
    localStorage.setItem(CACHE_TIME_KEY, Date.now().toString());
  }catch(e){}
}

function loadCache(){
  try{
    var t = parseInt(localStorage.getItem(CACHE_TIME_KEY)||'0');
    if(Date.now()-t < CACHE_TTL){
      var d = localStorage.getItem(CACHE_KEY);
      if(d) return JSON.parse(d);
    }
  }catch(e){}
  return null;
}

function formatTime(ts){
  var d = new Date(parseInt(ts));
  return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

function render(){
  var filtered = allCifras.filter(function(c){
    var ms = !currentSearch || c.name.toLowerCase().indexOf(currentSearch.toLowerCase())!==-1;
    var mf = currentFilter==='all'
      || (currentFilter==='sem-tom' && !c.tone)
      || (c.tone && c.tone.replace('m','').charAt(0)===currentFilter);
    return ms && mf;
  });

  var badge = document.getElementById('count-badge');
  if(currentSearch || currentFilter!=='all'){
    badge.innerHTML = '<strong>'+filtered.length+'</strong> <span>de '+allCifras.length+'</span>';
  } else {
    badge.innerHTML = '<strong>'+allCifras.length+'</strong> <span>cifras</span>';
  }

  var list = document.getElementById('cifra-list');
  list.innerHTML = '';

  if(!filtered.length){
    list.innerHTML = '<div class="empty"><span>&#128195;</span>Nenhuma cifra encontrada</div>';
    return;
  }

  filtered.forEach(function(c){
    var card = document.createElement('a');
    card.className = 'cifra-card';
    card.href = c.url;
    card.target = '_blank';
    card.rel = 'noopener';

    var icon = document.createElement('span');
    icon.className = 'cifra-icon';
    icon.innerHTML = fileIcon(c.mime);

    var info = document.createElement('div');
    info.className = 'cifra-info';

    var nm = document.createElement('div');
    nm.className = 'cifra-name';
    nm.textContent = c.name;

    var meta = document.createElement('div');
    meta.className = 'cifra-meta';
    if(c.tone){
      var tp = document.createElement('span');
      tp.className = 'tone-pill';
      tp.textContent = c.tone;
      meta.appendChild(tp);
    } else {
      meta.textContent = 'Sem tom identificado';
    }

    info.appendChild(nm);
    info.appendChild(meta);

    var arr = document.createElement('span');
    arr.className = 'cifra-arrow';
    arr.innerHTML = '&#8250;';

    card.appendChild(icon);
    card.appendChild(info);
    card.appendChild(arr);
    list.appendChild(card);
  });
}

function sync(force){
  var btn = document.getElementById('sync-btn');
  btn.innerHTML = '<span class="spin">&#8635;</span> Buscando...';
  btn.disabled = true;
  setStatus('Buscando cifras no Drive...', 'loading');

  fetchFromDrive(function(err, cifras){
    btn.innerHTML = '&#8635; Sincronizar';
    btn.disabled = false;
    if(err === 'api_key_invalid'){
      // Fallback: try without API key using public folder endpoint
      fetchPublic(function(err2, cifras2){
        if(err2){
          setStatus('Configure a API Key para sincronizar', 'err');
        } else {
          allCifras = cifras2;
          saveCache(cifras2);
          try{ var t=localStorage.getItem(CACHE_TIME_KEY); setStatus('\u2713 '+cifras2.length+' cifras \u2013 '+formatTime(t), 'ok'); }catch(e){}
          render();
        }
      });
      return;
    }
    if(err){
      setStatus('Erro: '+err, 'err');
      return;
    }
    allCifras = cifras;
    saveCache(cifras);
    try{ var t=localStorage.getItem(CACHE_TIME_KEY); setStatus('\u2713 '+cifras.length+' cifras \u2013 '+formatTime(t), 'ok'); }catch(e){}
    render();
  });
}

// Public folder listing (no API key - uses gdrive export trick)
function fetchPublic(callback){
  // Use the Drive folder RSS/JSON export that works for public folders
  var url = 'https://corsproxy.io/?url=' + encodeURIComponent(
    'https://www.googleapis.com/drive/v3/files'
    + '?q=' + encodeURIComponent("'" + FOLDER_ID + "' in parents and trashed=false")
    + '&fields=files(id,name,mimeType)'
    + '&pageSize=200'
    + '&supportsAllDrives=true'
  );
  var xhr = new XMLHttpRequest();
  xhr.open('GET', url);
  xhr.onload = function(){
    try{
      var data = JSON.parse(xhr.responseText);
      if(!data.files){ callback('sem arquivos'); return; }
      var files = data.files.filter(function(f){
        return f.mimeType!=='application/vnd.google-apps.folder' && !/\.html?$/i.test(f.name);
      });
      var cifras = files.map(function(f){
        return {name:cleanName(f.name), tone:extractTone(f.name), url:'https://drive.google.com/file/d/'+f.id+'/view', mime:f.mimeType};
      });
      cifras.sort(function(a,b){return a.name.localeCompare(b.name,'pt');});
      callback(null, cifras);
    }catch(e){ callback('parse error'); }
  };
  xhr.onerror = function(){ callback('network error'); };
  xhr.send();
}

// Init
document.getElementById('search-inp').oninput = function(){currentSearch=this.value;render();};
document.getElementById('filter-row').onclick = function(e){
  var btn=e.target.closest('.filter-btn');
  if(!btn)return;
  document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  currentFilter=btn.dataset.filter;
  render();
};
document.getElementById('sync-btn').onclick = function(){sync(true);};

// Load cache first, then auto-sync
var cached = loadCache();
if(cached && cached.length){
  allCifras = cached;
  try{ var t=localStorage.getItem(CACHE_TIME_KEY); setStatus('\u2713 '+cached.length+' cifras (cache de '+formatTime(t)+')', 'ok'); }catch(e){}
  render();
  // Auto-refresh in background after 5s
  setTimeout(function(){sync(false);}, 5000);
} else {
  sync(true);
}

})();
</script>
</body>
</html>
